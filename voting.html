<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投票工具 - 深蓝信息</title>
<meta name="description" content="深蓝信息投票工具">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
:root {
  --accent: #3fc9e0;
  --accent2: #4a90d9;
  --accent-light: #8fe6f2;
  --text: #eaf4ff;
  --text-muted: #a9c4e6;
  --border: rgba(255, 255, 255, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: #0b1c3e;
  color: var(--text);
  line-height: 1.8;
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
}

/* 固定铺满视口的连续渐变背景层，滚动不产生接缝 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1200px 900px at 18% 6%, #1c3f7a 0%, transparent 60%),
    radial-gradient(1100px 800px at 95% 2%, #123a60 0%, transparent 55%),
    linear-gradient(160deg, #0a1a3a 0%, #0e2452 55%, #153a6b 100%);
}
#bgcanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.glow { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .5; z-index: 0; pointer-events: none; animation: float 14s ease-in-out infinite; }
.g1 { width: 340px; height: 340px; background: #2f8fd0; top: -80px; left: -60px; }
.g2 { width: 300px; height: 300px; background: #3fc9e0; bottom: -60px; right: -40px; animation-delay: -5s; }
@keyframes float { 0%,100% { transform: translate(0,0) } 50% { transform: translate(30px,-30px) } }

/* Header */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(10, 22, 40, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  transition: all 0.3s ease;
}

.header-inner {
  max-width: 1200px; margin: 0 auto;
  padding: 0 24px;
  display: flex; justify-content: space-between; align-items: center;
  height: 64px;
}

.logo {
  font-size: 1.4rem; font-weight: 700;
  color: var(--text);
  letter-spacing: 2px;
}

.logo span { color: var(--accent); }

.nav { display: flex; gap: 32px; }

.nav a {
  color: var(--text-muted); text-decoration: none;
  font-size: 0.95rem; font-weight: 500;
  transition: color 0.3s ease;
  position: relative;
}

.nav a:hover, .nav a.active { color: var(--text); }

.nav a::after {
  content: ''; position: absolute; bottom: -4px; left: 0;
  width: 0; height: 2px; background: var(--accent);
  transition: width 0.3s ease;
}

.nav a:hover::after, .nav a.active::after { width: 100%; }

.mobile-menu-btn {
  display: none; background: none; border: none;
  color: var(--text); font-size: 1.5rem; cursor: pointer;
}

/* Iframe container */
.iframe-container {
  position: fixed;
  top: 64px;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: calc(100vh - 64px);
  border: none;
  overflow: hidden;
  z-index: 1;
}

.iframe-container iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

@media (max-width: 768px) {
  .nav { display: none; }
  .mobile-menu-btn { display: block; }
}
</style>
</head>
<body>
<canvas id="bgcanvas"></canvas>
<div class="glow g1"></div><div class="glow g2"></div>

<header class="header">
  <div class="header-inner">
    <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">深蓝<span>信息</span></div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="AICompetencyAssess.html">AI胜任力</a>
      <a href="voting.html" class="active">投票工具</a>
    </nav>
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">&#9776;</button>
  </div>
</header>

<div class="iframe-container">
  <iframe
    src="https://app-by8qzosjykn5.appmiaoda.com"
    title="投票工具"
    allow="fullscreen; camera; microphone; geolocation"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
    loading="eager"
    importance="high"
  ></iframe>
</div>

<script>
// Mobile menu toggle
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
mobileMenuBtn.addEventListener('click', () => {
  alert('请使用桌面浏览器获得最佳体验');
});

// 背景粒子
(function(){
  const cv=document.getElementById('bgcanvas'), c=cv.getContext('2d');
  let W,H,pts;
  function rz(){ W=cv.width=innerWidth; H=cv.height=innerHeight;
    pts=Array.from({length:Math.min(70,Math.floor(W*H/22000))},()=>({
      x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:Math.random()*1.8+.6 })); }
  rz(); addEventListener('resize',rz);
  (function loop(){ c.clearRect(0,0,W,H);
    for(let i=0;i<pts.length;i++){ const p=pts[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      c.beginPath(); c.arc(p.x,p.y,p.r,0,7); c.fillStyle='rgba(120,200,235,.55)'; c.fill();
      for(let j=i+1;j<pts.length;j++){ const q=pts[j], dx=p.x-q.x, dy=p.y-q.y, dd=dx*dx+dy*dy;
        if(dd<11000){ c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(q.x,q.y);
          c.strokeStyle='rgba(90,169,230,'+(0.14*(1-dd/11000))+')'; c.lineWidth=1; c.stroke(); } } }
    requestAnimationFrame(loop); })();
})();
</script>

</body>
</html>
